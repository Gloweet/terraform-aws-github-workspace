name: terraform-aws-github-workspace
workspace:
  mainBranch: main
  worktreeRoot: /worktrees/terraform-aws-github-workspace
  defaultAgent: claude
  autoPull:
    enabled: true
    intervalSeconds: 300
profiles:
  default:
    runtime: host
    yolo: true
    panes:
    - id: agent
      kind: agent
      focus: true
    - id: linear
      kind: command
      split: right
      command: linear-tui
